name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore StockPilot.sln --locked-mode
      - run: dotnet build StockPilot.sln -c Release --no-restore
      - run: dotnet format whitespace StockPilot.sln --verify-no-changes --no-restore
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project src/StockPilot.Infrastructure --startup-project src/StockPilot.Web --configuration Release --no-build -- --design-only
      - run: dotnet test StockPilot.sln -c Release --no-build --logger trx --results-directory ${{ runner.temp }}/results
      - run: node --check src/StockPilot.Web/wwwroot/assets/app.js && node --check src/StockPilot.Web/wwwroot/assets/cart.js
  sql-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Start isolated ephemeral SQL Server
        shell: bash
        run: |
          password="Sp!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "STOCKPILOT_TEST_SQLSERVER=Server=127.0.0.1,14333;Database=master;User ID=sa;Password=$password;Encrypt=true;TrustServerCertificate=true" >> "$GITHUB_ENV"
          docker run -d --name stockpilot-test-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" -p 127.0.0.1:14333:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in {1..60}; do
            if docker exec -e SQLCMDPASSWORD="$password" stockpilot-test-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'SQL Server failed readiness'; exit 1
      - run: dotnet restore StockPilot.sln --locked-mode
      - run: dotnet build StockPilot.sln -c Release --no-restore
      - name: Install CI-only Chromium
        shell: pwsh
        run: ./tests/StockPilot.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: SQL Server workflow and concurrency tests
        env:
          STOCKPILOT_BROWSER: "1"
          STOCKPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: dotnet test tests/StockPilot.IntegrationTests -c Release --no-build --logger trx --results-directory ${{ runner.temp }}/sql-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sql-server-results
          path: |
            ${{ runner.temp }}/sql-results
            ${{ runner.temp }}/screenshots
      - name: Remove only this job's disposable container
        if: always()
        run: docker rm -f stockpilot-test-sql
