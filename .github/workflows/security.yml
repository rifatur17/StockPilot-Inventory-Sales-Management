name: Security
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dependencies-and-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore and enforce all advisory severities
        run: dotnet restore StockPilot.sln --locked-mode --force-evaluate
      - name: Show direct and transitive advisories
        run: dotnet list StockPilot.sln package --vulnerable --include-transitive
      - name: Verify pinned Gitleaks release
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan full relevant history including root commit
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --no-banner .'
